services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refund
      POSTGRES_DB: refund
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refund"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Local disposable database only. Do not use this compose file for production.
