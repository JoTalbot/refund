[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "refund-operations-platform"
version = "0.1.0"
description = "Compliant refund operations platform MVP built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TRAE Agent" }
]
dependencies = [
  "alembic>=1.16.4,<2.0.0",
  "fastapi>=0.116.1,<1.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.1,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refund_ops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/refund_ops/tests"]
